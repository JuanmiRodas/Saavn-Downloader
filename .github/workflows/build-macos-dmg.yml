name: Build macOS DMG App

on:
  push:
    branches:
      - master
      - main
      - "feat/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64-AppleSilicon
          - runner: macos-15-intel
            arch: x86_64-Intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and macOS packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview pyobjc-framework-Cocoa pyobjc-framework-WebKit pytest

      - name: Run unit tests
        run: |
          python -m pytest Tests/test_spotify_and_verification.py Tests/test_helper.py -v

      - name: Generate native macOS .icns icon
        run: |
          python packaging/make_icon.py packaging/SaavnDownloader.iconset
          iconutil -c icns packaging/SaavnDownloader.iconset -o packaging/SaavnDownloader.icns

      - name: Build Saavn-Downloader Studio.app with PyInstaller
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "Saavn-Downloader Studio" \
            --icon "packaging/SaavnDownloader.icns" \
            --osx-bundle-identifier "com.juanmirodas.saavndownloader.studio" \
            --add-data "scripts/web_assets:scripts/web_assets" \
            --hidden-import "webview.platforms.cocoa" \
            --hidden-import "mutagen.mp4" \
            desktop_app.py

      - name: Ad-hoc sign .app bundle
        run: |
          codesign --force --deep --sign - "dist/Saavn-Downloader Studio.app"
          codesign --verify --deep --strict "dist/Saavn-Downloader Studio.app" || true

      - name: Create drag-to-Applications DMG
        run: |
          mkdir -p dist/dmg_staging
          cp -R "dist/Saavn-Downloader Studio.app" dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications
          DMG_NAME="Saavn-Downloader-Studio-macOS-${{ matrix.arch }}.dmg"
          hdiutil create \
            -volname "Saavn-Downloader Studio" \
            -srcfolder dist/dmg_staging \
            -ov \
            -format UDZO \
            "dist/${DMG_NAME}"
          ls -lh "dist/${DMG_NAME}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saavn-Downloader-Studio-macOS-${{ matrix.arch }}
          path: dist/Saavn-Downloader-Studio-macOS-${{ matrix.arch }}.dmg

  publish-release:
    name: Publish GitHub Release with DMG downloads
    needs: build-macos
    runs-on: ubuntu-latest
    if: always() && (needs.build-macos.result == 'success' || needs.build-macos.result == 'failure')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify at least one DMG was built
        run: |
          ls -lh release_assets/
          test -n "$(find release_assets -maxdepth 1 -name '*.dmg' -print -quit)"

      - name: Create or update GitHub Release with DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="studio-latest"
          TITLE="Saavn-Downloader Studio (macOS DMG)"
          cat <<'EOF' > release_notes.md
          ## Saavn-Downloader Studio for macOS

          - **Apple Silicon (M1 / M2 / M3 / M4):** Download `Saavn-Downloader-Studio-macOS-arm64-AppleSilicon.dmg`
          - **Intel Mac:** Download `Saavn-Downloader-Studio-macOS-x86_64-Intel.dmg`

          ### Installation on macOS
          1. Open the `.dmg` and drag **Saavn-Downloader Studio.app** into **Applications**.
          2. Because this build is ad-hoc signed (not notarized with a paid Apple Developer ID), the first time you launch it: **right-click → Open**, or run:
             ```sh
             xattr -cr "/Applications/Saavn-Downloader Studio.app"
             ```
          3. Downloads are saved by default to `~/Music/Saavn-Downloader`, and your 83-Anime Collection Gallery & CD To-Do progress is stored in `~/Library/Application Support/Saavn-Downloader/`.
          EOF
          sed -i 's/^          //' release_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/*.dmg --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md --target "${{ github.sha }}"
          else
            gh release create "$TAG" release_assets/*.dmg --title "$TITLE" --notes-file release_notes.md --target "${{ github.sha }}"
          fi
